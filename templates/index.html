<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Sentinel - Human Detection Alert System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #ef4444 0%, #7c3aed 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status-badge {
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .status-secure {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
        
        .status-alert {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .video-container {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .video-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .video-overlay.alert {
            box-shadow: inset 0 0 100px rgba(239, 68, 68, 0.5);
            border: 4px solid #ef4444;
        }
        
        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding: 16px 24px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .info-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
            font-size: 0.85rem;
        }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            gap: 20px;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #ef4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">🛡️</div>
                <h1>CV Sentinel</h1>
            </div>
            <div id="status-badge" class="status-badge status-secure">
                <span>●</span>
                <span id="status-text">SECURE</span>
            </div>
        </header>
        
        <main>
            <div class="video-container">
                <div id="video-overlay" class="video-overlay"></div>
                <img id="video-stream" src="/video_feed" alt="Video Stream" 
                     onerror="showLoading()" onload="hideLoading()">
                <div id="loading" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Initializing camera and detection model...</p>
                </div>
            </div>
            
            <div class="info-bar">
                <div class="info-item">
                    <span class="info-label">Detection Model</span>
                    <span class="info-value">YOLOv8-seg</span>
                </div>
                <div class="info-item">
                    <span class="info-label">ROI Type</span>
                    <span class="info-value">Mask Intersection</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Backend</span>
                    <span class="info-value">Python + Flask</span>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Powered by YOLOv8 Segmentation • Runs Locally • No Cloud Dependencies</p>
        </footer>
    </div>
    
    <script>
        // Connect to Server-Sent Events for real-time alert status
        const eventSource = new EventSource('/events');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const videoOverlay = document.getElementById('video-overlay');
        
        eventSource.onmessage = function(event) {
            try {
                // Parse the SSE data (it comes as a string like "{'alert': true}")
                const data = event.data.replace(/'/g, '"');
                const parsed = JSON.parse(data);
                
                if (parsed.alert) {
                    statusBadge.className = 'status-badge status-alert';
                    statusText.textContent = 'INTRUSION';
                    videoOverlay.classList.add('alert');
                } else {
                    statusBadge.className = 'status-badge status-secure';
                    statusText.textContent = 'SECURE';
                    videoOverlay.classList.remove('alert');
                }
            } catch (e) {
                console.error('Error parsing event:', e);
            }
        };
        
        eventSource.onerror = function() {
            console.log('SSE connection error, will retry...');
        };
        
        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
        }
        
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        // Fallback: Poll status if SSE doesn't work
        setInterval(async () => {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                
                if (data.triggered) {
                    statusBadge.className = 'status-badge status-alert';
                    statusText.textContent = 'INTRUSION';
                    videoOverlay.classList.add('alert');
                } else {
                    statusBadge.className = 'status-badge status-secure';
                    statusText.textContent = 'SECURE';
                    videoOverlay.classList.remove('alert');
                }
            } catch (e) {
                // Ignore fetch errors
            }
        }, 500);
    </script>
</body>
</html>
